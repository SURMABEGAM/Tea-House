<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tea House</title>
    <!-- Tailwind CSS CDN -->
      <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
      <!-- Font Awesome CDN -->
      <script src="https://kit.fontawesome.com/YOUR_KIT_CODE.js" crossorigin="anonymous"></script>

</head>
<body></body>  
<!-- Navbar -->
<header class="sticky top-0 z-50 bg-white shadow-md">
    <nav class="max-w-7xl mx-auto flex items-center justify-between px-6 py-4">

        <!-- Logo -->
        <a href="#" class="text-3xl font-bold text-orange-500">
            Tea <span class="text-black">House</span>
        </a>

        <!-- Desktop Menu -->
        <ul class="hidden md:flex items-center gap-8 font-medium">

            <li>
                <a href="#" data-lang="home" class="hover:text-orange-500 transition">
                    Home
                </a>
            </li>

            <li>
                <a href="#" data-lang="about" class="hover:text-orange-500 transition">
                    About
                </a>
            </li>

            <li>
                <a href="#" data-lang="products" class="hover:text-orange-500 transition">
                    Products
                </a>
            </li>

            <li>
                <a href="#" data-lang="contact" class="hover:text-orange-500 transition">
                    Contact
                </a>
            </li>

        </ul>

        <!-- Right Side -->
        <div class="flex items-center gap-3">

            <!-- Language -->
            <select id="languageSelect"
                class="border rounded-lg px-3 py-2 text-sm outline-none">

                <option value="en">English</option>
                <option value="bn">বাংলা</option>
                <option value="hi">हिन्दी</option>
                <option value="ar">العربية</option>

            </select>

            <!-- Theme -->
            <button id="themeToggle"
                class="w-10 h-10 rounded-full bg-orange-500 text-white hover:bg-orange-600 transition">

                🌙

            </button>

            <!-- Mobile Menu -->
            <button id="menuBtn"
                class="md:hidden text-3xl">

                ☰

            </button>

        </div>

    </nav>

    <!-- Mobile Menu -->
    <div id="mobileMenu"
        class="hidden md:hidden bg-white shadow-lg">

        <ul class="flex flex-col p-5 gap-4">

            <li><a href="#" data-lang="home">Home</a></li>

            <li><a href="#" data-lang="about">About</a></li>

            <li><a href="#" data-lang="products">Products</a></li>

            <li><a href="#" data-lang="contact">Contact</a></li>

        </ul>

    </div>

</header>
<!-- Hero Section -->
<section class="max-w-7xl mx-auto px-6 py-16 lg:py-24">
    <div class="grid lg:grid-cols-2 gap-12 items-center">

        <!-- Left Content -->
        <div>

            <h1
                data-lang="heroTitle"
                class="text-5xl md:text-6xl lg:text-7xl font-extrabold leading-tight text-gray-900">
                It's good tea time at The Tea House
            </h1>

            <p
                data-lang="heroText"
                class="mt-6 text-gray-600 text-lg leading-8 max-w-xl">
                Tea and Botanical Solutions Supplier Give Optimum Satisfaction To Your Taste Buds.
            </p>

            <button
                data-lang="explore"
                class="mt-8 inline-flex items-center gap-3 px-8 py-4 rounded-xl bg-gradient-to-r from-orange-500 to-red-500 text-white font-semibold shadow-lg hover:scale-105 duration-300">

                Explore More

                <span>➜</span>

            </button>

        </div>

        <!-- Right Content -->
        <div class="relative">

            <img
                src="asset/tea.jpg"
                alt="Tea Cup"
                class="w-full max-w-xl mx-auto">

            <!-- Rating Card -->
            <div
                class="absolute bottom-5 left-6 bg-white shadow-xl rounded-xl px-5 py-4 flex items-center gap-4">

                <div class="text-4xl text-yellow-400">
                    ⭐
                </div>

                <div>

                    <h3 class="text-2xl font-bold">
                        5.00
                    </h3>

                    <p class="text-gray-500">
                        Trust Pilot Ratings
                    </p>

                </div>

            </div>

        </div>

    </div>
</section>
</html>
